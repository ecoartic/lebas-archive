<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a3d">
<title>LEBAS — آرشیو انبار</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#f5f2ed; --card:#fff; --ink:#1d1d1b; --muted:#77736b; --line:#e4dfd6;
  --accent:#1f3a3d; --accent2:#c4703a; --ok:#2f7d4f; --warn:#b5482f; --chip:#ece7de;
  --r:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Vazirmatn","IRANSans",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:10px 14px 12px;
  padding-top:max(10px,env(safe-area-inset-top));box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;letter-spacing:.5px;margin-inline-end:auto}
.brand small{font-weight:400;opacity:.7;font-size:13px;margin-inline-start:6px}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn.primary{background:var(--accent2);border-color:var(--accent2)}
.hbtn.dirty{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(196,112,58,.45)}}
.searchrow{display:flex;gap:8px;margin-top:10px}
#q{flex:1;min-width:0;border:0;border-radius:12px;padding:10px 14px;font-size:16px;background:#fff;color:var(--ink)}
.filters{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select,.seg{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:5px 8px;flex:none}
.filters select option{color:var(--ink)}
.seg{display:flex;padding:2px;gap:2px}
.seg button{border:0;background:none;color:#fff;padding:3px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:var(--accent);font-weight:700}
main{padding:14px;max-width:1400px;margin:0 auto}
.stats{color:var(--muted);font-size:13px;margin:0 2px 10px;display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.ph{aspect-ratio:3/4;background:#ddd6ca center/cover no-repeat;position:relative}
.ph.none{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.code{position:absolute;top:8px;right:8px;background:rgba(29,29,27,.82);color:#fff;font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:2px 7px;border-radius:7px;direction:ltr}
.badge{position:absolute;bottom:8px;left:8px;font-size:11px;padding:1px 8px;border-radius:7px;background:var(--warn);color:#fff}
.nmulti{position:absolute;bottom:8px;right:8px;font-size:11px;padding:1px 7px;border-radius:7px;background:rgba(255,255,255,.9)}
.cb{padding:8px 10px 10px}
.cb b{display:block;font-size:14px}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap}
.meta span{background:var(--chip);border-radius:6px;padding:0 6px}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
.more{display:block;margin:18px auto;padding:9px 22px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,20,18,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media(min-width:800px){.ov{align-items:center}.sheet{border-radius:18px}}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh-head h2{margin:0;font-size:18px;margin-inline-end:auto}
.x{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:12px}
.gal img{height:min(58vh,520px);border-radius:12px;scroll-snap-align:center;flex:none;max-width:90%;object-fit:contain;background:#ddd6ca;cursor:zoom-in}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.mono{font-family:ui-monospace,Consolas,monospace;direction:ltr;display:inline-block}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.d{color:var(--warn);border-color:#e8c6bd}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){form .row{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label input,label select,label textarea{display:block;width:100%;margin-top:3px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.thumbs div{position:relative;width:78px;height:104px;border-radius:9px;overflow:hidden;background:#ddd}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:3px;left:3px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.addph{width:78px;height:104px;border:2px dashed var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:26px;background:#fff}
.codeprev{background:#fff;border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff;border-radius:10px;overflow:hidden}
td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right}
th{background:var(--chip)}
.note{background:#fff6e8;border:1px solid #efd9b4;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.zoom{position:fixed;inset:0;background:#000;z-index:80;display:none;align-items:center;justify-content:center}
.zoom.show{display:flex}.zoom img{max-width:100%;max-height:100%}
@media(max-width:480px){.brand small{display:none}.hbtn{padding:6px 10px}}
.pill{font-size:12.5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.pill.ok{background:#2f7d4f}.pill.bad{background:#b5482f}
#ov2{z-index:60}
.ro .edit-only{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">LEBAS <small>آرشیو انبار استانبول</small></div>
    
    
    
    <button class="hbtn" id="bMenu">⋯</button>
  </div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="جست‌وجو: کد (M-SH-012)، نوع، رنگ، سایز…" autocomplete="off">
  </div>
  <div class="filters">
    <div class="seg" id="fG"><button data-v="" class="on">همه</button><button data-v="M">مردانه</button><button data-v="W">زنانه</button></div>
    <select id="fCat"></select>
    <select id="fSize"></select>
    <select id="fColor"></select>
    <select id="fStatus"></select>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>نمایش بیشتر</button>
</main>

<div id="lock" style="position:fixed;inset:0;z-index:100;background:var(--accent);display:flex;align-items:center;justify-content:center;padding:20px">
  <form id="lockF" style="background:var(--bg);border-radius:18px;padding:22px;width:100%;max-width:360px;text-align:center">
    <div style="font-weight:800;font-size:22px;letter-spacing:.5px">LEBAS</div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:16px">آرشیو انبار لباس استانبول</div>
    <input id="pw" type="password" placeholder="رمز عبور" autocomplete="current-password" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:center;direction:ltr">
    <label style="display:flex;gap:6px;align-items:center;justify-content:center;margin:10px 0 0;color:var(--muted)"><input type="checkbox" id="rem" checked style="width:auto;margin:0">رمز روی این دستگاه بماند</label>
    <button class="btn p" type="submit" style="width:100%;margin-top:12px;padding:10px">ورود</button>
    <div id="lockMsg" style="color:var(--warn);font-size:13px;min-height:20px;margin-top:8px"></div>
  </form>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="zoom" id="zoom"><img alt=""></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const G={M:'مردانه',W:'زنانه'};
let D=null,KEY=null,shown=60,filter={g:'',cat:'',size:'',color:'',status:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faNum=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const normTxt=s=>faNum(String(s||'')).toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[‌\s]+/g,' ').trim();
const catName=it=>(D.cats[it.g]||{})[it.cat]||it.cat;
const fullType=it=>catName(it)+' '+G[it.g];
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms);}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

/* ---------- decryption ---------- */
let VAULT=null;
async function deriveKey(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(VAULT.salt),iterations:VAULT.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function dec(buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12));}
async function unlock(pw){
  if(!VAULT)VAULT=await (await fetch('vault.json',{cache:'no-store'})).json();
  KEY=await deriveKey(pw);
  const plain=await dec(b64(VAULT.data));   // throws on wrong password
  D=JSON.parse(new TextDecoder().decode(plain));
}
const imgCache=new Map();
function imgURL(name){
  if(!imgCache.has(name))imgCache.set(name,fetch('p/'+name).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(dec).then(b=>URL.createObjectURL(new Blob([b],{type:'image/jpeg'}))));
  return imgCache.get(name);
}
function hydrate(root){root.querySelectorAll('img[data-p]').forEach(el=>{if(io)io.observe(el);else load(el);});}
function load(el){const n=el.dataset.p;el.removeAttribute('data-p');imgURL(n).then(u=>el.src=u).catch(()=>{el.alt='عکس باز نشد';});}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);load(e.target);}}),{rootMargin:'400px'}):null;

$('#lockF').onsubmit=async e=>{
  e.preventDefault();const pw=$('#pw').value.trim();if(!pw)return;
  $('#lockMsg').textContent='در حال باز کردن…';
  try{await unlock(pw);try{if($('#rem').checked)localStorage.setItem('lebas_pw',pw);else localStorage.removeItem('lebas_pw');}catch(_){}
    start();}
  catch(err){KEY=null;$('#lockMsg').textContent=VAULT?'رمز اشتباه است':'اتصال برقرار نشد؛ اینترنت را بررسی کنید';}
};
(async()=>{let pw=null;try{pw=localStorage.getItem('lebas_pw');}catch(_){}
  if(pw){try{await unlock(pw);start();return;}catch(_){try{localStorage.removeItem('lebas_pw');}catch(__){}}}
  $('#pw').focus();})();
function logout(){try{localStorage.removeItem('lebas_pw');}catch(_){}location.reload();}

/* ---------- list ---------- */
function fillSelect(el,label,vals,cur){el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${esc(v[0])}"${v[0]===cur?' selected':''}>${esc(v[1])}</option>`).join('');}
const SIZE_ORDER=['XS','S','M','L','XL','2XL','3XL','FREE'];
const sizeKey=s=>{const i=SIZE_ORDER.indexOf(s);return i>=0?i:100+(parseFloat(s)||999);};
function buildFilters(){
  const pool=D.items.filter(i=>!filter.g||i.g===filter.g);const cm={};
  for(const i of pool){const l=D.cats[i.g][i.cat]||i.cat;const lab=filter.g?l:l+' ('+G[i.g]+')';cm[i.cat]=cm[i.cat]&&cm[i.cat]!==lab?l:lab;}
  if(filter.cat&&!cm[filter.cat])filter.cat='';
  fillSelect($('#fCat'),'همه دسته‌ها',Object.entries(cm).sort((a,b)=>a[1].localeCompare(b[1],'fa')),filter.cat);
  fillSelect($('#fSize'),'همه سایزها',[...new Set(pool.map(i=>i.size).filter(Boolean))].sort((a,b)=>sizeKey(a)-sizeKey(b)).map(s=>[s,s]),filter.size);
  fillSelect($('#fColor'),'همه رنگ‌ها',[...new Set(pool.map(i=>i.color).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa')).map(s=>[s,s]),filter.color);
  fillSelect($('#fStatus'),'همه وضعیت‌ها',[...new Set(D.items.map(i=>i.status))].map(s=>[s,s]),filter.status);
}
$('#fG').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter.g=b.dataset.v;[...$('#fG').children].forEach(x=>x.classList.toggle('on',x===b));buildFilters();render(true);};
for(const [id,k] of [['#fCat','cat'],['#fSize','size'],['#fColor','color'],['#fStatus','status']])$(id).onchange=e=>{filter[k]=e.target.value;render(true);};
let qT;$('#q').oninput=()=>{clearTimeout(qT);qT=setTimeout(()=>render(true),120);};
function matches(it,terms){
  if(filter.g&&it.g!==filter.g)return false;if(filter.cat&&it.cat!==filter.cat)return false;
  if(filter.size&&it.size!==filter.size)return false;if(filter.color&&it.color!==filter.color)return false;
  if(filter.status&&it.status!==filter.status)return false;if(!terms.length)return true;
  const hay=normTxt([it.code,it.code.replace(/-/g,''),fullType(it),it.color,it.size,it.status,it.note].join(' '));
  return terms.every(t=>hay.includes(t));
}
const badge=s=>s==='موجود'?'':`<span class="badge" style="${s==='امانت'?'background:#c4903a':''}">${esc(s)}</span>`;
function render(reset){
  if(reset)shown=60;
  const terms=normTxt($('#q').value).split(' ').filter(Boolean).map(t=>t.replace(/^([mw])-?([a-z]{2})-?(\d{1,3})$/,(m,a,b,c)=>`${a}-${b}-${c.padStart(3,'0')}`));
  const list=D.items.filter(it=>matches(it,terms));
  const cnt=g=>D.items.filter(i=>i.g===g&&i.status==='موجود').length;
  $('#stats').innerHTML=`<span>نتیجه: <b>${list.length}</b></span><span>کل اجناس: ${D.items.length}</span><span>در انبار مردانه: ${cnt('M')}</span><span>در انبار زنانه: ${cnt('W')}</span>`+(D.updated?`<span>به‌روزرسانی: ${esc(D.updated)}</span>`:'');
  const g=$('#grid');
  if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">چیزی پیدا نشد.</div>';$('#more').hidden=true;return;}
  g.innerHTML=list.slice(0,shown).map(it=>`
   <div class="card" data-code="${esc(it.code)}">
    <div class="ph${it.photos.length?'':' none'}">${it.photos.length?`<img data-p="${esc(it.photos[0])}" alt="">`:'بدون عکس'}
     <span class="code">${esc(it.code)}</span>${badge(it.status)}${it.photos.length>1?`<span class="nmulti">${it.photos.length} عکس</span>`:''}
    </div>
    <div class="cb"><b>${esc(fullType(it))}</b><div class="meta"><span>${esc(it.color||'—')}</span><span class="mono">${esc(it.size||'—')}</span>${it.note?'<span>⚠︎</span>':''}</div></div>
   </div>`).join('');
  hydrate(g);$('#more').hidden=list.length<=shown;
}
$('#more').onclick=()=>{shown+=60;render();};
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)openItem(c.dataset.code);};

/* ---------- sheets ---------- */
function openSheet(html){$('#sheet').onclick=null;$('#sheet').innerHTML=html;$('#ov').classList.add('show');$('#sheet').scrollTop=0;hydrate($('#sheet'));}
function closeSheet(){$('#ov').classList.remove('show');}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeSheet();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#zoom').classList.contains('show'))$('#zoom').classList.remove('show');else closeSheet();}});
$('#zoom').onclick=()=>$('#zoom').classList.remove('show');
function openItem(code){
  const it=D.items.find(i=>i.code===code);if(!it)return;
  openSheet(`<div class="sh-head"><h2>${esc(fullType(it))}</h2><button class="x" data-a="close">×</button></div>
   ${it.photos.length?`<div class="gal">${it.photos.map(p=>`<img data-p="${esc(p)}" alt="">`).join('')}</div>`:'<div class="note">این جنس عکس ندارد.</div>'}
   <dl class="dl"><dt>کد</dt><dd><span class="mono">${esc(it.code)}</span></dd><dt>نوع</dt><dd>${esc(fullType(it))}</dd>
   <dt>رنگ</dt><dd>${esc(it.color||'—')}</dd><dt>سایز</dt><dd><span class="mono">${esc(it.size||'—')}</span></dd>
   <dt>وضعیت</dt><dd>${esc(it.status)}</dd>${it.note?`<dt>یادداشت</dt><dd>${esc(it.note)}</dd>`:''}</dl>
   <div class="acts"><button class="btn" data-a="copy">کپی کد</button></div>`);
  $('#sheet').onclick=async e=>{
    if(e.target.tagName==='IMG'&&e.target.closest('.gal')&&e.target.src){$('#zoom img').src=e.target.src;$('#zoom').classList.add('show');return;}
    const a=e.target.dataset.a;if(a==='close')closeSheet();
    if(a==='copy'){try{await navigator.clipboard.writeText(it.code);toast('کد کپی شد: '+it.code);}catch(_){toast(it.code);}}
  };
}
function codesHelp(){
  const tbl=g=>Object.entries(D.cats[g]).sort((a,b)=>a[0].localeCompare(b[0])).map(([c,l])=>`<tr><td class="mono">${g}-${c}-###</td><td>${esc(l)} ${G[g]}</td><td>${D.items.filter(i=>i.g===g&&i.cat===c).length}</td></tr>`).join('');
  openSheet(`<div class="sh-head"><h2>راهنمای کدها</h2><button class="x" onclick="closeSheet()">×</button></div>
   <p>ساختار کد: <b class="mono">جنسیت-دسته-شماره</b><br>مثال: <b class="mono">M-SH-012</b> = <b>M</b> مردانه، <b>SH</b> پیراهن، دوازدهمین پیراهن مردانه. <b>W</b> یعنی زنانه.</p>
   <div class="note">در جست‌وجو کد را بدون خط تیره هم می‌شود نوشت (msh12).</div>
   <table><tr><th>کد</th><th>دسته</th><th>تعداد</th></tr>${tbl('M')}${tbl('W')}</table>`);
}
$('#bMenu').onclick=()=>{openSheet(`<div class="sh-head"><h2>گزینه‌ها</h2><button class="x" onclick="closeSheet()">×</button></div>
  <div class="acts" style="flex-direction:column;align-items:stretch"><button class="btn" id="m1">راهنمای کدها</button><button class="btn d" id="m2">خروج و پاک کردن رمز از این دستگاه</button></div>
  <div class="note">این نسخه فقط برای مشاهده است. تغییرات را مدیر آرشیو ثبت می‌کند.</div>`);
  $('#m1').onclick=codesHelp;$('#m2').onclick=logout;};

function start(){$('#lock').remove();buildFilters();render(true);}
</script>
</body>
</html>
